<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.discordapp.com https://i.ytimg.com; connect-src 'self' wss://dev.pulsoid.net https://japi.rest https://api.lanyard.rest; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Sachiko Fukuari</title>
  <link rel="canonical" href="https://sachikofukuari.github.io/">
  <meta name="description" content="hi, this is my portfolio page :3">
  <meta name="theme-color" content="#f48fb1">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sachikofukuari.github.io/">
  <meta property="og:title" content="Sachiko Fukuari (幸子福有)">
  <meta property="og:description" content="hi, this is my portfolio page :3">
  <meta property="og:image" content="https://sachikofukuari.github.io/assets/images/og-preview.jpg?v=11">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sachiko Fukuari portfolio landing page with glowing lotus and wildflowers">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sachiko Fukuari (幸子福有)">
  <meta name="twitter:description" content="hi, this is my portfolio page :3">
  <meta name="twitter:image" content="https://sachikofukuari.github.io/assets/images/og-preview.jpg?v=11">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Sachiko Fukuari",
    "alternateName": "幸子福有",
    "url": "https://sachikofukuari.github.io/",
    "sameAs": [
      "https://github.com/sachikofukuari"
    ]
  }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap">
  <link rel="preload" href="./assets/fonts/1FTV-VIP-Alpha-Brights.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <noscript><style>.intro-greeting, .bloom-cue { opacity: 1 !important; visibility: visible !important; }</style></noscript>
</head>
<body data-stage="intro">
  <!-- Soft pink + drifting white mist fallback behind WebGL -->
  <div class="bg-fallback" aria-hidden="true"></div>

  <!-- Background WebGL starry twilight sky + curved aurora behind intro copy -->
  <canvas id="sky-canvas" class="sky-canvas" aria-hidden="true"></canvas>

  <!-- Transparent foreground WebGL flowerbed + 3D lotus layered over intro copy -->
  <canvas id="lotus-canvas" class="lotus-canvas" aria-hidden="true"></canvas>

  <!-- Constant-radius blur veil for open inner pages (avoids re-filtering 120Hz WebGL) -->
  <div class="open-blur-veil" aria-hidden="true"></div>

  <!-- Graceful static/CSS fallback shown only if WebGL context cannot initialize -->
  <div id="lotus-svg-fallback" class="lotus-svg-fallback" hidden aria-hidden="true"></div>

  <!-- Soft dark vignette framing viewport borders -->
  <div class="page-vignette" aria-hidden="true"></div>

  <!-- Top-left back button (visible on open inner page) -->
  <button id="btn-back-intro" class="back-intro-btn" type="button" aria-label="Back to lotus intro" title="Back to intro" aria-hidden="true" tabindex="-1">
    <svg class="util-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </button>

  <!-- Persistent top-right display controls -->
  <div class="utility-dock" role="toolbar" aria-label="Display controls">
    <button id="btn-lang-toggle" class="util-icon-btn" type="button" aria-label="Chuyển sang Tiếng Việt" title="Chuyển sang Tiếng Việt"></button>
    <button id="btn-motion-toggle" class="util-icon-btn" type="button" aria-label="Pause motion" title="Pause motion">
      <svg class="util-icon icon-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <line x1="9" y1="6" x2="9" y2="18"/>
        <line x1="15" y1="6" x2="15" y2="18"/>
      </svg>
      <svg class="util-icon icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 6.5v11l9.5-5.5L8 6.5Z"/>
      </svg>
    </button>
  </div>

  <!-- Closed side-view lotus intro overlay -->
  <div id="intro-stage" class="intro-stage">
    <button id="intro-bloom-trigger" class="intro-hitarea" type="button" aria-label="Hello, im Ari — Bloom lotus to enter portfolio">
      <span class="intro-copy">
        <span id="intro-greeting" class="intro-greeting" aria-label="Hello, im Ari">Hello, im Ari</span>
      </span>
      <span id="intro-cue" class="bloom-cue" aria-hidden="true">scroll or click</span>
    </button>
  </div>

  <!-- Multi-view SPA portfolio shell revealed when lotus blooms -->
  <div id="portfolio-shell" class="portfolio-shell" aria-hidden="true" inert>
    <div id="portfolio-scroll" class="portfolio-scroll">
      <main id="portfolio-view" class="portfolio-main" tabindex="-1"></main>
    </div>
  </div>

  <!-- Fixed bottom navigation bar kept outside transform container for true sticky positioning -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="Portfolio sections" aria-hidden="true" inert>
    <button class="bottom-nav-btn" type="button" data-tab="home" aria-current="page">
      <span class="nav-pill-bg" aria-hidden="true"></span>
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5Z"/>
      </svg>
      <span data-nav-label="home">home</span>
    </button>
    <button class="bottom-nav-btn" type="button" data-tab="tools">
      <span class="nav-pill-bg" aria-hidden="true"></span>
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="3" width="12" height="18" rx="6"/>
        <line x1="12" y1="7" x2="12" y2="10"/>
      </svg>
      <span data-nav-label="tools">tools</span>
    </button>
    <button class="bottom-nav-btn" type="button" data-tab="works">
      <span class="nav-pill-bg" aria-hidden="true"></span>
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="3"/>
        <circle cx="8.5" cy="9.5" r="1.5"/>
        <path d="m21 16-5-5-5 5-3-3-5 5"/>
      </svg>
      <span data-nav-label="works">works</span>
    </button>
    <button class="bottom-nav-btn" type="button" data-tab="contact">
      <span class="nav-pill-bg" aria-hidden="true"></span>
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/>
        <circle cx="8.5" cy="11" r="2"/>
        <path d="M5.5 16c.8-1.4 2-2 3-2s2.2.6 3 2"/>
        <line x1="14" y1="10" x2="18.5" y2="10"/>
        <line x1="14" y1="13.5" x2="17.5" y2="13.5"/>
      </svg>
      <span data-nav-label="contact">contact</span>
    </button>
  </nav>

  <!-- Minimal floating mini-player shown when song plays off the Home tab -->
  <div id="mini-player" class="mini-player" role="region" hidden aria-label="Now playing">
    <button id="mini-player-toggle" class="mini-player-btn" type="button" aria-label="Pause song"></button>
    <span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <button id="mini-player-open-home" class="mini-player-title" type="button" title="Jump to Home player"></button>
    <button id="mini-player-close" class="mini-player-close" type="button" aria-label="Stop and hide mini player">×</button>
  </div>

  <!-- Quick-view modal for peripherals & works -->
  <dialog id="item-dialog" class="item-dialog" closedby="any" aria-labelledby="dialog-title">
    <div class="dialog-sheet">
      <div class="dialog-head">
        <span id="dialog-eyebrow" class="dialog-eyebrow"></span>
        <button id="dialog-close" class="dialog-close" type="button" aria-label="Close details">×</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </div>
  </dialog>

  <!-- Live region for clipboard & view announcements -->
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <!-- Global falling-petal cursor trail across intro + every view -->
  <canvas id="petal-cursor-canvas" class="petal-cursor-canvas" aria-hidden="true"></canvas>

  <!-- Persistent offscreen YouTube player host so playback survives inner tab changes -->
  <div id="yt-audio-host" class="yt-audio-host" aria-hidden="true">
    <div id="yt-audio-player"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
